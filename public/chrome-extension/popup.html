<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Cookie Extractor</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>YouTube Cookie Auto-Sync</h2>
    <div id="status">
        <p><strong>Status:</strong> <span id="syncStatus">Checking...</span></p>
        <p><strong>Last Sync:</strong> <span id="lastSync">Never</span></p>
    </div>

    <h3>Manual Controls</h3>
    <textarea id="cookieText" readonly placeholder="Cookies will appear here when extracted..."></textarea>
    <button id="extractCookies">Extract Cookies</button>
    <button id="uploadCookies">Upload to Server</button>
    <button id="forceSyncCookies">Force Auto-Sync Now</button>

    <script src="popup.js"></script>

</body>
</html>
